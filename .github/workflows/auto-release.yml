name: Auto Release for Obtainium

# Triggered automatically by sync-upstream.yml when a new upstream tag is detected,
# or manually to build and publish any upstream AAPS tag.
#
# Signed APKs are published as GitHub releases on this (private) repo.
# Obtainium reads them using a GitHub access token.
#
# Required GitHub Secrets:
#   KEYSTORE_SET   — base64(keystore_b64|store_pass|alias|key_pass)  [or individual secrets]

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'AAPS upstream version tag to build (e.g. 3.4.2.2)'
        required: true
        type: string
      buildVariant:
        description: 'Build variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug
          - aapsclientRelease
          - aapsclientDebug
          - aapsclient2Release
          - aapsclient2Debug
          - pumpcontrolRelease
          - pumpcontrolDebug

permissions:
  contents: write  # required to create releases and upload assets

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      # ── Keystore ────────────────────────────────────────────────────────────
      - name: Decode keystore secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_SET }}" ]; then
            DECODED=$(echo "${{ secrets.KEYSTORE_SET }}" | base64 -d)
            KEYSTORE_BASE64=$(echo "$DECODED" | cut -d'|' -f1)
            KEYSTORE_PASSWORD=$(echo "$DECODED" | cut -d'|' -f2)
            KEY_ALIAS=$(echo "$DECODED" | cut -d'|' -f3)
            KEY_PASSWORD=$(echo "$DECODED" | cut -d'|' -f4)
            echo "✅ Keystore extracted from KEYSTORE_SET"
          else
            KEYSTORE_BASE64="${{ secrets.KEYSTORE_BASE64 }}"
            KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            echo "ℹ️ Using individual keystore secrets"
          fi
          echo "KEYSTORE_BASE64=$KEYSTORE_BASE64" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Check keystore secrets
        run: |
          MISSING=0
          check() { [ -z "$1" ] && echo "❌ Missing: $2" && MISSING=1; }
          check "$KEYSTORE_BASE64"  "KEYSTORE_BASE64"
          check "$KEYSTORE_PASSWORD" "KEYSTORE_PASSWORD"
          check "$KEY_ALIAS"        "KEY_ALIAS"
          check "$KEY_PASSWORD"     "KEY_PASSWORD"
          [ "$MISSING" -eq 1 ] && exit 1
          echo "✅ All keystore secrets present."

      - name: Decode keystore file
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Validate keystore
        run: |
          echo "test" > dummy.txt && zip -q dummy.jar dummy.txt && rm dummy.txt
          LOG=$(mktemp)
          if ! jarsigner \
              -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              dummy.jar "$KEY_ALIAS" > "$LOG" 2>&1; then
            echo "❌ Keystore validation failed:"; cat "$LOG"
            rm -f "$LOG" dummy.jar; exit 1
          fi
          rm -f "$LOG" dummy.jar
          echo "✅ Keystore validated."

      # ── Source ──────────────────────────────────────────────────────────────
      - name: Checkout fork at HEAD (reads jdk-map.json before tag switch)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream tag
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git || true
          git fetch upstream "refs/tags/${{ github.event.inputs.tagName }}:refs/tags/${{ github.event.inputs.tagName }}"
          echo "✅ Fetched tag ${{ github.event.inputs.tagName }} from upstream."

      - name: Determine JDK version from jdk-map.json
        run: |
          TAG="${{ github.event.inputs.tagName }}"
          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)
          while IFS=$'\t' read -r pattern jdk; do
            [[ "$TAG" == $pattern ]] && JAVA_VERSION="$jdk" && break
          done < <(jq -r '.mappings[] | "\(.pattern)\t\(.jdk)"' .github/jdk-map.json)
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV
          echo "ℹ️ Tag $TAG → JDK $JAVA_VERSION"

      - name: Switch to upstream tag
        run: |
          git checkout "refs/tags/${{ github.event.inputs.tagName }}"
          echo "✅ Checked out ${{ github.event.inputs.tagName }}"

      # ── Build env ────────────────────────────────────────────────────────────
      - name: Set build variant env vars
        run: |
          BUILD_VARIANT="${{ github.event.inputs.buildVariant }}"
          VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
          VARIANT_TYPE=$(echo "$BUILD_VARIANT"  | grep -oE '(Release|Debug)$'    | tr '[:upper:]' '[:lower:]')
          VERSION_SUFFIX=""
          [[ "$VARIANT_FLAVOR" != "full" ]]   && VERSION_SUFFIX="$VARIANT_FLAVOR"
          [[ "$VARIANT_TYPE"   == "debug" ]]  && VERSION_SUFFIX="${VERSION_SUFFIX}-debug"
          [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]] && VERSION_SUFFIX="-$VERSION_SUFFIX"
          echo "BUILD_VARIANT=$BUILD_VARIANT"     >> $GITHUB_ENV
          echo "VARIANT_FLAVOR=$VARIANT_FLAVOR"   >> $GITHUB_ENV
          echo "VARIANT_TYPE=$VARIANT_TYPE"       >> $GITHUB_ENV
          echo "VERSION_SUFFIX=$VERSION_SUFFIX"   >> $GITHUB_ENV

      - name: Extract VERSION from source
        run: |
          TAG="${{ github.event.inputs.tagName }}"
          if echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            VERSION="$TAG"
          else
            VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.workers.max=8 \
            -Dorg.gradle.caching=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APKs with version
        run: |
          mv "app/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}"/*.apk \
             "aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk"
          mv "wear/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}"/*.apk \
             "aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk"

      # ── Publish GitHub release ───────────────────────────────────────────────
      - name: Create GitHub release and upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tagName }}"
          VERSION="${{ env.VERSION }}"
          SUFFIX="${{ env.VERSION_SUFFIX }}"
          APK="aaps-${VERSION}${SUFFIX}.apk"
          WEAR_APK="aaps-wear-${VERSION}${SUFFIX}.apk"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ℹ️ Release $TAG already exists — uploading assets."
          else
            echo "📦 Creating GitHub release $TAG..."
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "AAPS ${VERSION}${SUFFIX}" \
              --notes "Automated build of AAPS ${VERSION} from upstream nightscout/AndroidAPS."
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$APK" "$WEAR_APK"

          echo "🎉 Release complete: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
