name: Auto Release for Obtainium

# Triggered automatically by sync-upstream.yml when a new upstream tag is detected,
# or manually to build and publish any upstream AAPS tag.
#
# Signed APKs are published as releases on the private Gitea repo at git.aleshym.co.
# Obtainium reads from that private repo using a Gitea access token.
#
# Required GitHub Secrets:
#   KEYSTORE_SET   — base64(keystore_b64|store_pass|alias|key_pass)  [or individual secrets]
#   GITEA_TOKEN    — Gitea token with write:repository scope
#
# Required GitHub Variables (Settings → Variables → Repository variables):
#   GITEA_OWNER    — Gitea username or organisation
#   GITEA_REPO     — Gitea repository name (e.g. AndroidAPS)

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'AAPS upstream version tag to build (e.g. 3.4.2.2)'
        required: true
        type: string
      buildVariant:
        description: 'Build variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug
          - aapsclientRelease
          - aapsclientDebug
          - aapsclient2Release
          - aapsclient2Debug
          - pumpcontrolRelease
          - pumpcontrolDebug

env:
  GITEA_URL: https://git.aleshym.co

jobs:
  build-release:
    name: Build & Publish to Gitea
    runs-on: ubuntu-latest
    steps:
      # ── Keystore ────────────────────────────────────────────────────────────
      - name: Decode keystore secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_SET }}" ]; then
            DECODED=$(echo "${{ secrets.KEYSTORE_SET }}" | base64 -d)
            KEYSTORE_BASE64=$(echo "$DECODED" | cut -d'|' -f1)
            KEYSTORE_PASSWORD=$(echo "$DECODED" | cut -d'|' -f2)
            KEY_ALIAS=$(echo "$DECODED" | cut -d'|' -f3)
            KEY_PASSWORD=$(echo "$DECODED" | cut -d'|' -f4)
            echo "✅ Keystore extracted from KEYSTORE_SET"
          else
            KEYSTORE_BASE64="${{ secrets.KEYSTORE_BASE64 }}"
            KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            echo "ℹ️ Using individual keystore secrets"
          fi
          echo "KEYSTORE_BASE64=$KEYSTORE_BASE64" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Check keystore secrets
        run: |
          MISSING=0
          # NB: must not be an && chain. When the value IS present the chain
          # returns non-zero, and under `bash -e` that aborts the step
          # silently — so this guard only ever worked when a secret was
          # missing, and failed the build whenever all four were set.
          check() { if [ -z "$1" ]; then echo "❌ Missing: $2"; MISSING=1; fi; }
          check "$KEYSTORE_BASE64"  "KEYSTORE_BASE64"
          check "$KEYSTORE_PASSWORD" "KEYSTORE_PASSWORD"
          check "$KEY_ALIAS"        "KEY_ALIAS"
          check "$KEY_PASSWORD"     "KEY_PASSWORD"
          [ "$MISSING" -eq 1 ] && exit 1
          echo "✅ All keystore secrets present."

      # Publishing is the last step of a ~20 minute build, so a bad token or a
      # wrong repo path used to cost the whole build before surfacing. Check it
      # up front instead.
      - name: Check Gitea is reachable
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER }}
          GITEA_REPO:  ${{ vars.GITEA_REPO }}
        run: |
          set -uo pipefail
          if [ -z "${GITEA_TOKEN:-}" ]; then echo "::error::GITEA_TOKEN is not set."; exit 1; fi
          if [ -z "${GITEA_OWNER:-}" ] || [ -z "${GITEA_REPO:-}" ]; then
            echo "::error::GITEA_OWNER and/or GITEA_REPO variables are not set."; exit 1
          fi
          URL="$GITEA_URL/api/v1/repos/$GITEA_OWNER/$GITEA_REPO"
          CODE=$(curl -s -o /tmp/gitea_probe.json -w '%{http_code}' \
                 -H "Authorization: token $GITEA_TOKEN" "$URL")
          echo "GET $URL -> HTTP $CODE"
          case "$CODE" in
            200)
              # An empty repo has no commit for a release tag to point at, so
              # release creation fails later with an opaque error. Catch it here.
              if [ "$(jq -r '.empty' < /tmp/gitea_probe.json)" = "true" ]; then
                echo "::error::The Gitea repo $GITEA_OWNER/$GITEA_REPO is empty."
                echo "A release tag needs a commit to point at. Push any commit"
                echo "to it (a README is enough) and re-run."
                exit 1
              fi
              echo "✅ Gitea repo reachable and non-empty: $GITEA_OWNER/$GITEA_REPO" ;;
            401|403)
              echo "::error::Gitea rejected the token (HTTP $CODE). Check GITEA_TOKEN and that it has the write:repository scope."
              cat /tmp/gitea_probe.json; exit 1 ;;
            404)
              echo "::error::Gitea has no repo at $GITEA_OWNER/$GITEA_REPO (HTTP 404). Check the GITEA_OWNER and GITEA_REPO variables, or that the token can see it."
              cat /tmp/gitea_probe.json; exit 1 ;;
            *)
              echo "::error::Unexpected response from Gitea (HTTP $CODE)."
              cat /tmp/gitea_probe.json; exit 1 ;;
          esac

      - name: Decode keystore file
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Validate keystore
        run: |
          echo "test" > dummy.txt && zip -q dummy.jar dummy.txt && rm dummy.txt
          LOG=$(mktemp)
          if ! jarsigner \
              -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              dummy.jar "$KEY_ALIAS" > "$LOG" 2>&1; then
            echo "❌ Keystore validation failed:"; cat "$LOG"
            rm -f "$LOG" dummy.jar; exit 1
          fi
          rm -f "$LOG" dummy.jar
          echo "✅ Keystore validated."

      # ── Source ──────────────────────────────────────────────────────────────
      - name: Checkout fork at HEAD (reads jdk-map.json before tag switch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream tag
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git || true
          git fetch upstream "refs/tags/${{ github.event.inputs.tagName }}:refs/tags/${{ github.event.inputs.tagName }}"
          echo "✅ Fetched tag ${{ github.event.inputs.tagName }} from upstream."

      - name: Determine JDK version from jdk-map.json
        run: |
          TAG="${{ github.event.inputs.tagName }}"
          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)
          while IFS=$'\t' read -r pattern jdk; do
            [[ "$TAG" == $pattern ]] && JAVA_VERSION="$jdk" && break
          done < <(jq -r '.mappings[] | "\(.pattern)\t\(.jdk)"' .github/jdk-map.json)
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV
          echo "ℹ️ Tag $TAG → JDK $JAVA_VERSION"

      - name: Switch to upstream tag
        run: |
          git checkout "refs/tags/${{ github.event.inputs.tagName }}"
          echo "✅ Checked out ${{ github.event.inputs.tagName }}"

      # ── Build env ────────────────────────────────────────────────────────────
      - name: Set build variant env vars
        run: |
          BUILD_VARIANT="${{ github.event.inputs.buildVariant }}"
          VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
          VARIANT_TYPE=$(echo "$BUILD_VARIANT"  | grep -oE '(Release|Debug)$'    | tr '[:upper:]' '[:lower:]')
          VERSION_SUFFIX=""
          [[ "$VARIANT_FLAVOR" != "full" ]]   && VERSION_SUFFIX="$VARIANT_FLAVOR"
          [[ "$VARIANT_TYPE"   == "debug" ]]  && VERSION_SUFFIX="${VERSION_SUFFIX}-debug"
          [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]] && VERSION_SUFFIX="-$VERSION_SUFFIX"
          echo "BUILD_VARIANT=$BUILD_VARIANT"     >> $GITHUB_ENV
          echo "VARIANT_FLAVOR=$VARIANT_FLAVOR"   >> $GITHUB_ENV
          echo "VARIANT_TYPE=$VARIANT_TYPE"       >> $GITHUB_ENV
          echo "VERSION_SUFFIX=$VERSION_SUFFIX"   >> $GITHUB_ENV

      - name: Extract VERSION from source
        run: |
          TAG="${{ github.event.inputs.tagName }}"
          if echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            VERSION="$TAG"
          else
            VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.workers.max=8 \
            -Dorg.gradle.caching=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APKs with version
        run: |
          mv "app/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}"/*.apk \
             "aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk"
          mv "wear/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}"/*.apk \
             "aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk"

      - name: Verify APK signing certificate
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "❌ apksigner not found at $APKSIGNER"
            exit 1
          fi
          echo "Using $APKSIGNER"

          APK="aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk"
          WEAR_APK="aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk"
          EXPECTED_LC="$(echo "${EXPECTED:-}" | tr 'A-F' 'a-f' | tr -d ' :')"

          FAILED=0
          for FILE in "$APK" "$WEAR_APK"; do
            echo "🔍 Verifying $FILE"
            if ! OUT="$("$APKSIGNER" verify --print-certs "$FILE" 2>&1)"; then
              echo "❌ $FILE failed signature verification:"
              echo "$OUT"
              FAILED=1
              continue
            fi
            echo "$OUT"
            # Match the CERTIFICATE digest specifically: apksigner also prints a
            # "public key SHA-256 digest" line, and a bare 'SHA-256 digest:'
            # match only avoids it by luck of ordering. The `|| true` keeps a
            # no-match from aborting the step under `set -e`, so the explicit
            # "could not read" message below is actually reachable.
            FP="$(echo "$OUT" | grep -i 'certificate SHA-256 digest:' | head -1 \
                  | awk '{print $NF}' | tr 'A-F' 'a-f' | tr -d ' :' || true)"
            if [ -z "$FP" ]; then
              echo "❌ Could not read a certificate fingerprint from $FILE"
              FAILED=1
              continue
            fi
            if [ -z "$EXPECTED_LC" ]; then
              echo "❌ Repository variable RELEASE_CERT_SHA256 is not set."
              echo "   Observed fingerprint: $FP"
              echo "   Once you have confirmed that is your real release key, set it under"
              echo "   Settings → Secrets and variables → Actions → Variables."
              FAILED=1
              continue
            fi
            if [ "$FP" != "$EXPECTED_LC" ]; then
              echo "❌ Signing certificate mismatch for $FILE"
              echo "   expected: $EXPECTED_LC"
              echo "   actual:   $FP"
              echo "   Publishing this would break Obtainium updates for every existing install."
              FAILED=1
              continue
            fi
            echo "✅ $FILE is signed with the expected release certificate."
          done
          [ "$FAILED" -eq 0 ]

      # ── Publish to Gitea ─────────────────────────────────────────────────────
      - name: Create Gitea release and upload APKs
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER }}
          GITEA_REPO:  ${{ vars.GITEA_REPO }}
        run: |
          TAG="${{ github.event.inputs.tagName }}"
          VERSION="${{ env.VERSION }}"
          SUFFIX="${{ env.VERSION_SUFFIX }}"
          APK="aaps-${VERSION}${SUFFIX}.apk"
          WEAR_APK="aaps-wear-${VERSION}${SUFFIX}.apk"
          BASE="$GITEA_URL/api/v1/repos/$GITEA_OWNER/$GITEA_REPO"
          AUTH="Authorization: token $GITEA_TOKEN"

          # ── Build the release body ───────────────────────────────────────────
          # Fetch a few recent releases and pick the newest that is not this tag,
          # so a re-run against an existing release still compares against the
          # genuine predecessor.
          PREV=$(curl -sf -H "$AUTH" "$BASE/releases?limit=5" || echo '[]')

          prev_size_of() {
            echo "$PREV" | jq -r --arg n "$1" --arg t "$TAG" \
              '[ .[] | select(.tag_name != $t) ] | .[0].assets[]? | select(.name == $n) | .size' \
              | head -1
          }

          fmt_size() { awk -v s="$1" 'BEGIN{printf "%.2f MiB", s/1048576}'; }

          fmt_delta() {
            local now="$1" prev="$2"
            if [ -z "$prev" ] || [ "$prev" = "null" ]; then echo "n/a"; return; fi
            awk -v d="$((now - prev))" -v p="$prev" \
              'BEGIN{printf "%+.2f MiB (%+.1f%%)", d/1048576, (p==0 ? 0 : 100*d/p)}'
          }

          {
            printf 'Automated build of AAPS %s from upstream nightscout/AndroidAPS.\n\n' "$VERSION"
            printf '| Asset | Size | Δ vs previous | SHA-256 |\n'
            printf '| --- | --- | --- | --- |\n'
            for FILE in "$APK" "$WEAR_APK"; do
              NAME="$(basename "$FILE")"
              SIZE="$(stat -c%s "$FILE")"
              SHA="$(sha256sum "$FILE" | awk '{print $1}')"
              printf '| `%s` | %s | %s | `%s` |\n' \
                "$NAME" "$(fmt_size "$SIZE")" \
                "$(fmt_delta "$SIZE" "$(prev_size_of "$NAME")")" "$SHA"
            done
          } > /tmp/release-body.md

          RELEASE_BODY="$(cat /tmp/release-body.md)"
          echo "Release body:"
          cat /tmp/release-body.md

          echo "🔍 Checking if Gitea release $TAG already exists..."
          EXISTING_ID=$(curl -sf -H "$AUTH" "$BASE/releases/tags/$TAG" | jq -r '.id // empty')

          if [ -n "$EXISTING_ID" ]; then
            echo "ℹ️ Release $TAG already exists (id=$EXISTING_ID) — refreshing notes and uploading assets."
            RELEASE_ID="$EXISTING_ID"
            PATCH=$(jq -n --arg body "$RELEASE_BODY" '{body: $body}')
            curl -sf -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
              "$BASE/releases/$RELEASE_ID" -d "$PATCH" >/dev/null
          else
            echo "📦 Creating Gitea release $TAG..."
            BODY=$(jq -n \
              --arg tag  "$TAG" \
              --arg name "AAPS ${VERSION}${SUFFIX}" \
              --arg body "$RELEASE_BODY" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')
            HTTP=$(curl -s -w "%{http_code}" -o /tmp/gitea_release.json \
              -X POST -H "$AUTH" -H "Content-Type: application/json" \
              "$BASE/releases" -d "$BODY")
            if [[ "$HTTP" != "20"* ]]; then
              echo "::error::Creating the Gitea release failed (HTTP $HTTP):"
              cat /tmp/gitea_release.json
              exit 1
            fi
            RELEASE_ID=$(jq -r '.id' < /tmp/gitea_release.json)
            echo "✅ Release created (id=$RELEASE_ID)"
          fi

          upload_asset() {
            FILE="$1"
            echo "⬆️ Uploading $FILE..."
            HTTP=$(curl -s -w "%{http_code}" -o /tmp/gitea_upload.json \
              -X POST -H "$AUTH" \
              -F "attachment=@${FILE};type=application/vnd.android.package-archive" \
              "$BASE/releases/$RELEASE_ID/assets?name=$(basename $FILE)")
            if [[ "$HTTP" != "20"* ]]; then
              echo "❌ Upload failed (HTTP $HTTP):"
              cat /tmp/gitea_upload.json
              exit 1
            fi
            echo "✅ Uploaded: $FILE"
          }

          upload_asset "$APK"
          upload_asset "$WEAR_APK"

          echo "🎉 Gitea release complete: $GITEA_URL/$GITEA_OWNER/$GITEA_REPO/releases/tag/$TAG"
